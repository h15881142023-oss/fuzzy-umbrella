<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ region_name }}数据平台{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">{{ region_name }}</div>
      <div class="brand-sub">数据平台 · {{ cities|length }} 城</div>
      <nav class="nav">
        {% for item in nav_items %}
          <a href="{{ item.path }}" class="{% if current_path == item.path %}active{% endif %}">{{ item.label }}</a>
        {% endfor %}
      </nav>
      <div style="margin-top:28px">
        <a class="btn btn-ghost" href="{{ url_for('logout') }}">退出登录</a>
      </div>
    </aside>
    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
